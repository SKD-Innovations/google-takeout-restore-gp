name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0; Node 24
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify Playwright uses Node.js 24
        shell: bash
        run: |
          python - <<'PYCODE'
          import pathlib, subprocess, sys
          import playwright
          node = pathlib.Path(playwright.__file__).parent / 'driver' / ('node.exe' if sys.platform == 'win32' else 'node')
          version = subprocess.check_output([str(node), '--version'], text=True).strip()
          assert version.startswith('v24.'), 'Expected bundled Node.js 24, found ' + version
          print('Bundled Playwright Node.js:', version)
          PYCODE
      - run: python -m ruff check photorestore
      - name: Prepare bundled ExifTool on Windows
        if: runner.os == 'Windows'
        run: python scripts/prepare_exiftool.py
      - name: Run tests (bundled ExifTool on Windows)
        env:
          TAKEOUT_DEV_EXIFTOOL: ${{ runner.os == 'Windows' && format('{0}/photorestore/resources/exiftool/exiftool.exe', github.workspace) || '' }}
        run: python -m pytest -q
      - name: Install browser for isolated UI tests
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Verify Google quality-dialog handling with local HTML
        if: runner.os == 'Linux'
        run: python -m pytest -q tests/test_quality_dialog.py
      - name: Exercise desktop HTML and real backend
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: .
        run: python scripts/ui_smoke.py
