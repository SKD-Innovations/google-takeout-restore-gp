name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check photorestore
      - name: Prepare bundled ExifTool on Windows
        if: runner.os == 'Windows'
        run: python scripts/prepare_exiftool.py
      - name: Run tests (bundled ExifTool on Windows)
        env:
          TAKEOUT_DEV_EXIFTOOL: ${{ runner.os == 'Windows' && format('{0}/photorestore/resources/exiftool/exiftool.exe', github.workspace) || '' }}
        run: python -m pytest -q
      - name: Install browser for isolated UI tests
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Verify Google quality-dialog handling with local HTML
        if: runner.os == 'Linux'
        run: python -m pytest -q tests/test_quality_dialog.py
      - name: Exercise desktop HTML and real backend
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: .
        run: python scripts/ui_smoke.py
