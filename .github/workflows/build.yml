name: Build desktop packages
on:
  workflow_dispatch:
    inputs:
      sign_release:
        description: 'Sign a version tag using protected release-signing credentials'
        type: boolean
        default: false
      signing_platform:
        description: 'Platforms to sign (only used when signing is enabled)'
        type: choice
        options: [macos, windows, all]
        default: macos
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && (vars.RELEASE_SIGNING_ENABLED == 'true' || inputs.sign_release == true) && matrix.target != 'linux-x64' && ((inputs.signing_platform || vars.RELEASE_SIGNING_PLATFORMS || 'macos') == 'all' || startsWith(matrix.target, (inputs.signing_platform || vars.RELEASE_SIGNING_PLATFORMS || 'macos'))) && 'release-signing' || 'unsigned-build' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: macos-14
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      SIGN_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && (vars.RELEASE_SIGNING_ENABLED == 'true' || inputs.sign_release == true) && matrix.target != 'linux-x64' && ((inputs.signing_platform || vars.RELEASE_SIGNING_PLATFORMS || 'macos') == 'all' || startsWith(matrix.target, (inputs.signing_platform || vars.RELEASE_SIGNING_PLATFORMS || 'macos'))) }}
      MAC_SIGN_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/v') && (vars.RELEASE_SIGNING_ENABLED == 'true' || inputs.sign_release == true) && matrix.target != 'linux-x64' && ((inputs.signing_platform || vars.RELEASE_SIGNING_PLATFORMS || 'macos') == 'all' || startsWith(matrix.target, (inputs.signing_platform || vars.RELEASE_SIGNING_PLATFORMS || 'macos'))) && startsWith(matrix.target, 'macos-') && vars.MAC_SIGN_IDENTITY || '' }}
      PYTHONPATH: .
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject signing from a branch
        if: inputs.sign_release == true && !startsWith(github.ref, 'refs/tags/v')
        run: python -c "raise SystemExit('Signed builds require a version tag; select that tag when dispatching this workflow.')"
      - name: Validate signing platform selection
        if: startsWith(github.ref, 'refs/tags/v') && (vars.RELEASE_SIGNING_ENABLED == 'true' || inputs.sign_release == true)
        shell: bash
        env:
          SIGNING_PLATFORM: ${{ inputs.signing_platform || vars.RELEASE_SIGNING_PLATFORMS || 'macos' }}
        run: python -c "import os; assert os.environ['SIGNING_PLATFORM'] in ('macos', 'windows', 'all'), 'Invalid signing platform selection'"
      - name: Require release commit on protected main
        if: env.SIGN_RELEASE == 'true'
        shell: bash
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0; Node 24
        with:
          python-version: '3.12'
      - name: Read and validate package version
        id: version
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), 'Invalid package version'
          if os.environ['SIGN_RELEASE'] == 'true':
              assert os.environ['RELEASE_REF'] == 'refs/tags/v' + version, 'Tag/version mismatch'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgirepository1.0-dev libcairo2-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libwebkit2gtk-4.1-dev
          python -m pip install 'PyGObject==3.50.0' 'pycairo==1.28.0'
      - name: Install Python dependencies
        if: matrix.target != 'macos-x64'
        run: python -m pip install -r requirements-dev.txt
      - name: Build Intel cryptography with static OpenSSL
        if: matrix.target == 'macos-x64'
        shell: bash
        run: |
          export OPENSSL_DIR="$(brew --prefix openssl@3)"
          export OPENSSL_STATIC=1
          python -m pip install --no-cache-dir --no-binary cryptography -r requirements-dev.txt
          python - <<'PYCODE'
          import subprocess
          from cryptography.hazmat.bindings import _rust
          dependencies = subprocess.check_output(['otool', '-L', _rust.__file__], text=True)
          assert not any(name in dependencies for name in ('libssl.', 'libcrypto.')), dependencies
          print('Intel cryptography uses static OpenSSL')
          PYCODE
      - name: Verify Playwright uses Node.js 24
        shell: bash
        run: |
          python - <<'PYCODE'
          import pathlib, subprocess, sys
          import playwright
          node = pathlib.Path(playwright.__file__).parent / 'driver' / ('node.exe' if sys.platform == 'win32' else 'node')
          version = subprocess.check_output([str(node), '--version'], text=True).strip()
          assert version.startswith('v24.'), 'Expected bundled Node.js 24, found ' + version
          print('Bundled Playwright Node.js:', version)
          PYCODE
      - run: python -m ruff check photorestore
      - run: python scripts/prepare_exiftool.py
      - name: Test with bundled ExifTool
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export TAKEOUT_DEV_EXIFTOOL="$GITHUB_WORKSPACE/photorestore/resources/exiftool/exiftool.exe"
          else
            export TAKEOUT_DEV_EXIFTOOL="$GITHUB_WORKSPACE/photorestore/resources/exiftool/exiftool"
          fi
          python -m pytest -q
      - name: Verify and bundle WebView2 bootstrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare_webview2.ps1
      - run: python scripts/prepare_browser.py
      - name: Verify browser component offline
        run: python scripts/browser_component_smoke.py
      - name: Check original Chrome CDP flow (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/chrome_flow_smoke.py
      - name: Check original Chrome CDP flow (macOS and Windows)
        if: runner.os != 'Linux'
        run: python scripts/chrome_flow_smoke.py
      - name: Import Developer ID into temporary keychain
        if: runner.os == 'macOS' && env.SIGN_RELEASE == 'true'
        env:
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: python scripts/sign_macos.py setup
      - run: python scripts/collect_licenses.py
      - run: python -m PyInstaller --noconfirm packaging/TakeoutRestore.spec
      - name: Check packaged macOS runtime offline
        if: runner.os == 'macOS'
        run: '"dist/Takeout Restore.app/Contents/MacOS/TakeoutRestore" --self-test'
      - name: Check packaged Linux runtime offline
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/TakeoutRestore/TakeoutRestore --self-test
      - name: Check packaged Windows runtime offline
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'dist/TakeoutRestore/TakeoutRestore.exe' -ArgumentList '--self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Packaged self-test failed' }
      - name: Verify macOS signature
        if: runner.os == 'macOS' && env.SIGN_RELEASE == 'true'
        run: codesign --verify --deep --strict --verbose=2 'dist/Takeout Restore.app'
      - name: Create macOS DMG and portable app
        if: runner.os == 'macOS'
        run: python scripts/package_macos.py --target '${{ matrix.target }}'
      - name: Notarize and staple macOS DMG
        if: runner.os == 'macOS' && env.SIGN_RELEASE == 'true'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: python scripts/sign_macos.py notarize 'dist/TakeoutRestore-${{ steps.version.outputs.version }}-${{ matrix.target }}-preview.dmg'
      - name: Azure OIDC login
        if: runner.os == 'Windows' && env.SIGN_RELEASE == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0; Node 24
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows executable files
        if: runner.os == 'Windows' && env.SIGN_RELEASE == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0; PowerShell and Node 24 cache
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\TakeoutRestore
          files-folder-filter: exe,dll,pyd
          files-folder-recurse: true
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Create Windows installer and portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          Compress-Archive -Path dist/TakeoutRestore -DestinationPath dist/TakeoutRestore-${{ steps.version.outputs.version }}-windows-x64-portable.zip
      - name: Sign Windows installer
        if: runner.os == 'Windows' && env.SIGN_RELEASE == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0; PowerShell and Node 24 cache
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\installers
          files-folder-filter: exe
          exclude-environment-credential: true
          exclude-managed-identity-credential: true
          exclude-azure-cli-credential: false
      - name: Create Linux packages
        if: runner.os == 'Linux'
        run: python scripts/package_linux.py
      - run: python scripts/checksums.py
      - name: Explain unavailable private-repository provenance
        if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == true && vars.ENABLE_PRIVATE_ATTESTATIONS != 'true'
        shell: bash
        run: echo 'Provenance skipped. Private-repository attestations require GitHub Enterprise Cloud and ENABLE_PRIVATE_ATTESTATIONS=true. Building packages and platform code signing do not require this feature.' >> "$GITHUB_STEP_SUMMARY"
      - name: Generate provenance for release packages
        id: attest
        if: startsWith(github.ref, 'refs/tags/v') && (github.event.repository.private == false || vars.ENABLE_PRIVATE_ATTESTATIONS == 'true')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2; nested Node 24
        with:
          subject-path: |
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
            dist/installers/*-setup.exe
      - name: Record package signing status
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_TARGET: ${{ matrix.target }}
          ATTESTATION_OUTCOME: ${{ steps.attest.outcome }}
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          signed = os.environ['SIGN_RELEASE'] == 'true'
          target = os.environ['PACKAGE_TARGET']
          status = 'signed' if signed and not target.startswith('linux') else 'unsigned-preview'
          record = {'version': os.environ['PACKAGE_VERSION'], 'target': target, 'status': status,
                    'attestation': os.environ['ATTESTATION_OUTCOME'],
                    'note': 'CI artifacts are not published releases. Verify signatures before distributing.'}
          Path('dist/SIGNING-STATUS.json').write_text(json.dumps(record, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Package status\n' + target + ': ' + status + '\n')
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: TakeoutRestore-${{ steps.version.outputs.version }}-${{ matrix.target }}-${{ env.SIGN_RELEASE == 'true' && runner.os != 'Linux' && 'signed' || 'preview' }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
            dist/installers/*-setup.exe
            dist/SHA256SUMS
            dist/SIGNING-STATUS.json
            photorestore/resources/browser.json
      - name: Remove signing keychain and temporary private keys
        if: always() && runner.os == 'macOS' && env.SIGN_RELEASE == 'true'
        run: python scripts/sign_macos.py cleanup
