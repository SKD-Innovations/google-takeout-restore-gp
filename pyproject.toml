[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "takeout-restore"
version = "0.2.0"
description = "A cautious, local desktop workflow for restoring Google Photos Takeout exports"
requires-python = ">=3.12"
license = "Apache-2.0"
dynamic = ["dependencies"]

[project.gui-scripts]
takeout-restore = "photorestore.app:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["photorestore*"]

[tool.setuptools.package-data]
photorestore = ["ui/*", "resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["photorestore/resources", "vendor", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
